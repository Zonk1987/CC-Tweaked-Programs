name: Build and Version

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # Required to open a PR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Version Bumper and Size Calculator
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python .agents/scripts/version_bumper.py

      - name: Create Pull Request with changes
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-bump version and file sizes [skip ci]"
          branch: chore/auto-bump-${{ github.run_number }}
          delete-branch: true
          title: "chore: auto-bump version and file sizes (run #${{ github.run_number }})"
          body: |
            ## Automated Version Bump

            This PR was created automatically by the **Build and Version** workflow.

            ### Changes
            - 🔢 Updated version strings in all modified `startup.lua` files
            - 📦 Recalculated `sizeBytes` and `hash` for all entries in `manifest.lua`

            ---
            *This PR will auto-merge once all status checks pass.*
          labels: |
            automated
            chore

      - name: Enable auto-merge on PR
        if: steps.create-pr.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "${{ steps.create-pr.outputs.pull-request-url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

