name: CI Quality Checks

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      
      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"
          
      - name: Setup Luarocks
        uses: leafo/gh-actions-luarocks@v4
        
      - name: Lua Syntax Check (luac -p)
        run: |
          echo "Checking Lua syntax for all project files..."
          find . -name "*.lua" \
            -not -path "./.git/*" \
            -not -path "./.luarocks/*" \
            -not -path "./.*" \
            | sort | while read f; do
              luac -p "$f" || exit 1
            done
          echo "All files passed syntax check."

      - name: Install Luacheck
        run: luarocks install luacheck
        
      - name: Run Luacheck
        run: luacheck .

  check-markdown:
    name: Lychee (Markdown Links)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      
      - name: Check Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './**/*.md'
