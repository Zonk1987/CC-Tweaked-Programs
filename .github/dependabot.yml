# Dependabot configuration for CC:Tweaked-Programs
# Keeps GitHub Actions up-to-date automatically.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Monitor GitHub Actions for security patches and version updates.
  # Dependabot will open a Pull Request automatically when e.g.
  # actions/checkout or leafo/gh-actions-lua releases a new version.
  - package-ecosystem: "github-actions"
    directory: "/" # Scans /.github/workflows/*.yml
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"

